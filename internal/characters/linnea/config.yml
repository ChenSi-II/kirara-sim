# Exact local labels used by the community-data generator.
talents:
  - attack:
      - 'attack(1-Hit DMG|{param1:F1P})'
      - 'attack(2-Hit DMG|{param2:F1P})'
      - 'attack(3-Hit DMG|{param3:F1P})'
  - aim: 'attack(Aimed Shot|{param4:F1P})'
  - charge: 'attack(Fully-Charged Aimed Shot|{param5:P})'
  - collision: 'attack(Plunge DMG|{param6:F1P})'
  - lowPlunge: 'attack(Low/High Plunge DMG|{param7:P}/{param8:P}|0)'
  - highPlunge: 'attack(Low/High Plunge DMG|{param7:P}/{param8:P}|1)'
  - skillPummeler:
      - 'skill(Lumi Pound-Pound Pummeler DMG|{param1:F1P} DEF ×2)'
      - 'skill(Lumi Pound-Pound Pummeler DMG|{param1:F1P} DEF ×2)'
  - skillHeavy: 'skill(Lumi Heavy Overdrive Hammer DMG|{param2:F1P} DEF)'
  - skillMillion: 'skill(Lumi Million Ton Crush DMG|{param3:F1P} DEF)'
  - burstInitialFlat: 'burst(Initial Healing|{param1:I})'
  - burstInitialDef: 'burst(Initial Healing|{param2:F1P} DEF + {param1:I})'
  - burstContinuousFlat: 'burst(Continuous Healing|{param3:I})'
  - burstContinuousDef: 'burst(Continuous Healing|{param4:F1P} DEF + {param3:I})'

docs:
  fields:
    .linnea.lumi: Whether Lumi is active.
    .linnea.lumi-form: Lumi's current form (`super`, `standard`, or `absent`).
    .linnea.field-catalog: Current Field Catalog stacks.
  issues:
    - Skill swap endpoints and summon attack timelines use user timing image 9 (2026-10-04); see PLACEHOLDER_FRAMES.md for measured and inferred values.
    - Burst frames and healing interval, summon creation, intermediate tap counts, unrecorded Moon Cage arrivals, and hitboxes remain provisional.

abilities:
  - name: attack
  - name: charge
  - name: low_plunge
    params:
      collision: 0 to omit plunge collision damage (default), 1 to include it.
  - name: high_plunge
    params:
      collision: 0 to omit plunge collision damage (default), 1 to include it.
  - name: burst
  - name: skill
    params:
      taps: Number of consecutive Skill/Normal taps represented by the cast. Default 1; range 1–5.
