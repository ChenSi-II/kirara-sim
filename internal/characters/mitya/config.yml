# Numeric tables are generated by scripts/generate_mitya_valeriy_data.py.
docs:
  issues:
    - Animation, hitmarks and periodic attack intervals are unmeasured placeholders; see PLACEHOLDER_FRAMES.md.
    - Skill particle generation is not modeled because its count and delay are unconfirmed.

abilities:
  - name: attack
  - name: charge
    params:
      duration: Special charged-attack hold duration in frames, minimum 60. By default uses the current beacon count. Only applies while an overloaded core and at least one beacon are active.
  - name: low_plunge
    params:
      collision: 0 to omit plunge collision damage (default), 1 to include it.
  - name: high_plunge
    params:
      collision: 0 to omit plunge collision damage (default), 1 to include it.
  - name: skill
    params:
      hold: 0 for a steady core (tap, default), 1 for an overloaded core (hold).
  - name: burst
